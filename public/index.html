<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexFlow — Automações</title><style>body{margin:0;background:#0c1220;color:#f5f7fc;font:16px system-ui}header{padding:18px 30px;background:#131d32;border-bottom:1px solid #314467;display:flex;justify-content:space-between}main{max-width:920px;margin:40px auto;padding:16px}button,input,textarea{font:inherit;border-radius:9px;padding:12px}button{cursor:pointer;background:#476df5;color:white;border:0}input,textarea{background:#19253c;border:1px solid #476087;color:white;width:100%;box-sizing:border-box}section{background:#141f34;border:1px solid #2a405e;border-radius:18px;margin:18px 0;padding:24px}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#a5bad9}</style></head><body><header><strong>◆ NexFlow</strong><span>MVP local · Automações</span></header><main><h1>Crie seu primeiro fluxo</h1><p>Protótipo local com blocos JSON e execução manual. Editor visual avançado está no roadmap.</p><section><label>Token da API <input id="token" type="password" placeholder="NEXFLOW_API_TOKEN"></label><label>Nome do fluxo <input id="name" value="Boas-vindas"></label><label>Blocos e conexões (JSON)<textarea id="workflow" rows="13"></textarea></label><button id="create">Salvar fluxo</button> <button id="list">Meus fluxos</button><p id="message" role="status"></p></section><section><h2>Executar fluxo</h2><label>ID do fluxo <input id="id" placeholder="ID gerado ao salvar"></label><label>Entrada JSON <textarea id="input" rows="3">{"cliente":"Carlos"}</textarea></label><button id="run">Executar</button><h3>Resultado</h3><pre id="output"></pre></section><small>Não exponha este servidor na internet. Não use dados sensíveis.</small></main><script>const $=id=>document.getElementById(id);$('workflow').value=JSON.stringify({name:'Boas-vindas',nodes:[{id:'t',type:'trigger'},{id:'s',type:'set',data:{values:{mensagem:'Bem-vindo ao NexFlow'}}},{id:'o',type:'output'}],edges:[{source:'t',target:'s'},{source:'s',target:'o'}]},null,2);async function request(path,method='GET',data){let r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value},body:data===undefined?undefined:JSON.stringify(data)}),x=await r.json();if(!r.ok)throw Error(x.error||r.status);return x;}$('create').onclick=async()=>{try{let w=JSON.parse($('workflow').value);w.name=$('name').value;let x=await request('/api/workflows','POST',w);$('id').value=x.id;$('message').textContent='Salvo: '+x.id;}catch(e){$('message').textContent=e.message;}};$('list').onclick=async()=>{try{$('output').textContent=JSON.stringify(await request('/api/workflows'),null,2)}catch(e){$('output').textContent=e.message}};$('run').onclick=async()=>{try{$('output').textContent=JSON.stringify(await request('/api/workflows/'+encodeURIComponent($('id').value)+'/run','POST',JSON.parse($('input').value)),null,2)}catch(e){$('output').textContent=e.message}}</script></body></html>
